version: '3.8'

services:
  seyran-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seyran-syria-platform
    restart: unless-stopped
    ports:
      - "5001:5001"
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - JWT_SECRET=seyran_syria_production_jwt_secret_2026_xyz
    volumes:
      - seyran_data:/app/server
    networks:
      - seyran-net

  nginx:
    image: nginx:alpine
    container_name: seyran-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - certs_data:/etc/letsencrypt
    depends_on:
      - seyran-app
    networks:
      - seyran-net

volumes:
  seyran_data:
    driver: local
  certs_data:
    driver: local

networks:
  seyran-net:
    driver: bridge
